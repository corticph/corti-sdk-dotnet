name: ci

on: [push]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.x

      - name: Install tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore src/Corti/Corti.csproj

      - name: Build
        run: dotnet build src/Corti/Corti.csproj --no-restore -c Release

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.x

      - name: Install tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore src/Corti.Test/Corti.Test.csproj

      - name: Build
        run: dotnet build src/Corti.Test/Corti.Test.csproj --no-restore -c Release

      - name: Test
        run: dotnet test src/Corti.Test/Corti.Test.csproj --no-restore --no-build -c Release

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.x

      - name: Install tools
        run: dotnet tool restore

      - name: Lint
        run: dotnet format src/Corti/Corti.csproj --include src/Corti/Custom/ --verify-no-changes

  # NuGet Trusted Publishing (OIDC). The nuget.org trust policy is pinned to this repo,
  # workflow file "ci.yml" and environment "nuget-release" — renaming either breaks publishing.
  # NUGET_USER (environment secret) = nuget.org username of the policy creator, not the org.
  publish:
    needs: [compile, test, lint]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: nuget-release
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Extract version from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Tag '$TAG' is not a release tag (expected vMAJOR.MINOR.PATCH[-prerelease])"
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG"
          echo "version=$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed -i "s/Current = \"[^\"]*\"/Current = \"${VERSION}\"/" src/Corti/Core/Public/Version.cs
          echo "Version.cs: $(grep Current src/Corti/Core/Public/Version.cs)"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.x

      - name: Install tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore src/Corti/Corti.csproj

      - name: Build
        run: dotnet build src/Corti/Corti.csproj --no-restore -c Release

      - name: Pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet pack src/Corti/Corti.csproj --no-restore -c Release -p:Version="$VERSION"
          echo "packed version: $VERSION"

      # Mint the 1-hour key as late as possible (immediately before push).
      - name: NuGet login (OIDC → temporary API key)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push src/Corti/bin/Release/*.nupkg --api-key "$NUGET_API_KEY" --source "nuget.org"
